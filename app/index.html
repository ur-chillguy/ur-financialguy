<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EB">
<title>ur.financialguy</title>
<meta name="description" content="Catat arus kas, pantau kekayaan bersih, dan hitung dana darurat, KPR, tujuan keuangan, investasi, sampai pensiun. Data tersimpan di perangkat kamu.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="financialguy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..650&display=swap" rel="stylesheet">
<style>
:root{
  --vault:#0D1B16; --vault-2:#132721; --vault-3:#1B3329; --vault-line:#25402F;
  --bg:#EDF1EB; --surface:#FFFFFF; --surface-2:#F5F8F3; --sunken:#E4EAE3;
  --ink:#14201A; --ink-2:#34443C; --muted:#64736B; --line:#D7DFD7; --line-2:#C6D1C7;
  --brand:#1F5E46; --brand-2:#2B7A5C; --brand-soft:#DCEBE2;
  --gold:#FFC81E; --gold-ink:#3A2C00; --gold-soft:#FFF1C4;
  --pos:#1D8556; --pos-soft:#DDF1E5; --neg:#BE3B63; --neg-soft:#F8E0E7; --warn:#B7791F; --warn-soft:#FBEFD6;
  --c-income:#1F5E46; --c-living:#3A76A6; --c-debt:#BE3B63; --c-future:#2E9A6B; --c-gold:#D9A21B; --c-plum:#7A4FA0; --c-slate:#5E6E66;
  --radius:16px; --radius-sm:10px;
  --display:'Bricolage Grotesque','Geist',system-ui,sans-serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 0 rgba(13,27,22,.04),0 10px 30px -18px rgba(13,27,22,.35);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1410; --surface:#111E18; --surface-2:#15251D; --sunken:#0D1913;
  --ink:#E6EEE8; --ink-2:#C2D0C7; --muted:#8C9C93; --line:#22362B; --line-2:#2D4638;
  --brand:#5FC296; --brand-2:#7BD3AA; --brand-soft:#173A2A;
  --gold-soft:#3A3010; --pos:#4CC488; --pos-soft:#123826; --neg:#F07198; --neg-soft:#3E1726; --warn:#E6B04F; --warn-soft:#3A2C10;
  --c-income:#5FC296; --c-living:#6EA8D8; --c-debt:#F07198; --c-future:#4CC488; --c-gold:#F0C04A; --c-plum:#B58BDB; --c-slate:#8FA197;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1410; --surface:#111E18; --surface-2:#15251D; --sunken:#0D1913;
    --ink:#E6EEE8; --ink-2:#C2D0C7; --muted:#8C9C93; --line:#22362B; --line-2:#2D4638;
    --brand:#5FC296; --brand-2:#7BD3AA; --brand-soft:#173A2A;
    --gold-soft:#3A3010; --pos:#4CC488; --pos-soft:#123826; --neg:#F07198; --neg-soft:#3E1726; --warn:#E6B04F; --warn-soft:#3A2C10;
    --c-income:#5FC296; --c-living:#6EA8D8; --c-debt:#F07198; --c-future:#4CC488; --c-gold:#F0C04A; --c-plum:#B58BDB; --c-slate:#8FA197;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-feature-settings:"ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num,.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--vault);color:#DCE8E0;display:flex;flex-direction:column;overflow:hidden}
.side .rosette{position:absolute;right:-120px;bottom:-130px;width:360px;height:360px;opacity:.22;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:22px 22px 18px;text-decoration:none;color:#fff}
.brand svg{width:34px;height:34px;flex:none}
.wordmark{font:700 19px/1 var(--display);letter-spacing:-.02em}
.wordmark span{color:var(--gold)}
.nav{flex:1;overflow-y:auto;padding:4px 12px 20px;position:relative;z-index:1;scrollbar-width:thin;scrollbar-color:var(--vault-3) transparent}
.nav h6{margin:18px 12px 6px;font:500 12px/1.2 var(--body);color:#7F988A;letter-spacing:.01em}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C9D8CF;text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--vault-2);color:#fff}
.nav a[aria-current="page"]{background:var(--vault-3);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.side-foot{padding:14px 22px 20px;font-size:12.5px;color:#7F988A;position:relative;z-index:1;border-top:1px solid var(--vault-line)}
.side-foot b{color:#DCE8E0;font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,36px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;font:700 clamp(20px,2.2vw,26px)/1.1 var(--display);letter-spacing:-.025em;flex:1;min-width:0}
.top .m-brand{display:none}
.year{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);height:38px}
.year button{border:0;background:none;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.year button:hover{color:var(--ink);background:var(--surface-2)}
.year b{font:600 15px var(--body);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}
.content{padding:8px clamp(16px,3vw,36px) 64px;max-width:1280px;width:100%}
.lede{margin:0 0 22px;color:var(--muted);max-width:68ch}

/* ---------- bottom tabs (mobile) ---------- */
.tabs{display:none}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel.flat{background:transparent;border-style:dashed}
.panel h2,.sec-h{margin:0 0 4px;font:650 18px/1.25 var(--display);letter-spacing:-.015em}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-h h2{margin:0}
.panel-h .sub{margin:2px 0 0}
.stack>*+*{margin-top:18px}
.mt{margin-top:18px}.mt-l{margin-top:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}

.vault{background:var(--vault);color:#E3EEE7;border:0;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.vault .rosette{position:absolute;right:-90px;top:-90px;width:320px;height:320px;opacity:.28;pointer-events:none}
.vault .muted{color:#8FA99B}
.vault .pos{color:#62D69B}.vault .neg{color:#FF8DB0}

.metric .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.vault .metric .lbl{color:#9DB6A8}
.metric .val{font:700 clamp(24px,3vw,34px)/1.1 var(--display);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.metric .val.xl{font-size:clamp(32px,4.6vw,52px)}
.metric .foot{font-size:13px;margin-top:6px;color:var(--muted)}
.vault .metric .foot{color:#9DB6A8}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--vault);border-color:var(--vault);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:550;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;height:36px;padding:0 14px;font-weight:550;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.chip.has i{background:var(--brand-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] i{background:var(--gold)}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:32px;padding:0 14px;border-radius:999px;font-weight:550;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:550;color:var(--ink-2)}
.field small{color:var(--muted);font-size:12.5px;line-height:1.4}
.inp{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;height:42px;transition:border-color .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.inp input,.inp select{border:0;background:none;outline:none;height:100%;width:100%;padding:0 12px;min-width:0;font-variant-numeric:tabular-nums}
.inp select{appearance:none;padding-right:30px;cursor:pointer}
.inp.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.inp .pre,.inp .suf{color:var(--muted);font-size:13.5px;padding:0 0 0 12px;white-space:nowrap}
.inp .suf{padding:0 12px 0 0}
.inp .pre+input{padding-left:6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;align-content:start}
.form .full{grid-column:1/-1}
.helper{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.helper button{border:1px dashed var(--line-2);background:none;border-radius:999px;font-size:12.5px;padding:3px 10px;color:var(--brand);font-weight:550}
.helper button:hover{border-style:solid}

/* ledger tables */
.ledger{width:100%;border-collapse:separate;border-spacing:0}
.lg-group{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.lg-group+.lg-group{margin-top:14px}
.lg-head{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 120px 36px;gap:10px;align-items:center;padding:14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.lg-head h3{margin:0;font:650 15.5px/1.2 var(--display);display:flex;align-items:center;gap:9px}
.lg-title{min-width:0}
.lg-title small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 0 18px}
.lg-head.two{grid-template-columns:minmax(0,1fr) auto}
.lg-head .t{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;font-size:14px}
.lg-head .t small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.lg-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 120px 36px;gap:10px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line)}
.lg-row:last-of-type{border-bottom:0}
.lg-row .name input{border:0;background:none;width:100%;padding:8px 0;outline:none;font-weight:500}
.lg-row .name input:focus{box-shadow:inset 0 -2px 0 var(--gold)}
.lg-row .inp{height:38px}
.lg-row .diff{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:550}
.lg-row .x{border:0;background:none;width:32px;height:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center;opacity:.55}
.lg-row:hover .x,.lg-row .x:focus-visible{opacity:1}
.lg-row .x:hover{color:var(--neg);background:var(--neg-soft)}
.lg-row .x svg{width:15px;height:15px}
.lg-add{padding:8px 16px 12px}
.lg-cols{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 120px 36px;gap:10px;padding:0 16px 6px;font-size:12px;color:var(--muted);font-weight:550}
.lg-cols span:not(:first-child){text-align:right}
.lg-row.two,.lg-head.two,.lg-cols.two{grid-template-columns:minmax(0,1fr) 180px 80px 36px}

/* data tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:550;color:var(--muted);font-size:12.5px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th:first-child,.tbl td:first-child,.tbl th.l{text-align:left}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:650;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl .inp{height:36px;min-width:110px}
.tbl td.ed{padding:5px 6px}
.tbl td.ed .inp input{text-align:right}
.tbl td.ed.l .inp input{text-align:left}
.tbl tr.yr{cursor:pointer}
.tbl tr.yr:hover td{background:var(--surface-2)}
.tbl tr.sub td{color:var(--muted);font-size:13px;background:var(--surface-2)}

/* status */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--pos-soft);color:var(--pos)}
.badge.bad{background:var(--neg-soft);color:var(--neg)}
.badge.mid{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand-2);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.vault .bar{background:rgba(255,255,255,.1)}
.vault .bar>i{background:var(--gold)}

/* checkup */
.check{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0;padding-bottom:2px}
.check:first-child{padding-top:2px}
.check h4{margin:0;font-weight:600;font-size:14.5px}
.check p{margin:0;font-size:12.5px;color:var(--muted)}
.check .v{text-align:right;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.check .meter{grid-column:1/-1;margin-top:8px;position:relative;height:10px;border-radius:99px;background:var(--sunken)}
.check .meter .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--pos) 26%,transparent);border-radius:99px}
.check .meter .pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.check .meta{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font:11.5px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis0{stroke:var(--line-2)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hit{fill:transparent}
.hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--vault);color:#EAF2EC;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;font-variant-numeric:tabular-nums}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:650;color:#fff}
#tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}
#tip .tr span{display:inline-flex;align-items:center;gap:6px;color:#A9C0B3}

/* empty */
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);background:var(--surface-2)}
.empty h3{margin:0 0 6px;color:var(--ink);font:650 17px var(--display)}
.empty p{margin:0 auto 14px;max-width:46ch;font-size:14px}

/* pyramid */
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;padding:8px 0}
.pyr button{border:0;color:#fff;font-weight:600;font-size:13.5px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;position:relative;overflow:hidden;transition:transform .2s}
.pyr button:hover{transform:scale(1.015)}
.pyr button .fill{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pyr button span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pyr button[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.lvl-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lvl-item:last-child{border-bottom:0}
.lvl-item input[type=checkbox]{appearance:none;width:22px;height:22px;border:1.6px solid var(--line-2);border-radius:7px;display:grid;place-items:center;flex:none;cursor:pointer;background:var(--surface)}
.lvl-item input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
.lvl-item input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.lvl-item .t{flex:1;border:0;background:none;outline:none;padding:4px 0;min-width:0;resize:none;line-height:1.45;overflow:hidden;font:inherit}
.lvl-item .t:focus{box-shadow:inset 0 -2px 0 var(--gold)}

.goal{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}

.goal-top input.title{font:650 18px var(--display);border:0;background:none;outline:none;flex:1;min-width:0;letter-spacing:-.015em}

.goal-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;padding:18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv>div{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.kv .k{font-size:12.5px;color:var(--muted)}
.kv .v{font:700 19px/1.2 var(--display);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv .v small{font:500 12.5px var(--body);color:var(--muted);letter-spacing:0}
.kv .hl{background:var(--vault);color:#E7F0EA}
.kv .hl .k{color:#9DB6A8}

.verdict{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.verdict svg{width:20px;height:20px;flex:none;margin-top:1px}
.verdict.ok{background:var(--pos-soft);border-color:transparent}
.verdict.ok svg{color:var(--pos)}
.verdict.bad{background:var(--neg-soft);border-color:transparent}
.verdict.bad svg{color:var(--neg)}
.verdict.mid{background:var(--warn-soft);border-color:transparent}
.verdict.mid svg{color:var(--warn)}
.verdict b{display:block;margin-bottom:2px}

.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.place{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.place h4{margin:0 0 4px;font-size:14.5px;font-weight:650;display:flex;gap:8px;align-items:center}
.place h4 svg{width:16px;height:16px;flex:none;color:var(--pos)}
.place.no h4 svg{color:var(--neg)}
.place p{margin:0;font-size:13.5px;color:var(--ink-2)}
.place .fit{margin-top:8px;font-size:12.5px;color:var(--muted)}
.place.no{background:var(--surface-2)}

.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font:700 28px/1 var(--display);letter-spacing:-.03em}
.ring .c small{font-size:12px;color:var(--muted)}
.vault .ring .c small{color:#9DB6A8}

.gl-search{max-width:420px;margin-bottom:18px}
.gl{columns:2;column-gap:28px}
.gl dl{break-inside:avoid;margin:0 0 16px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.gl dt{font:650 16px var(--display);margin-bottom:4px}
.gl dd{margin:0;color:var(--ink-2);font-size:14px}

.modal p{margin:0 0 16px;color:var(--ink-2)}

.welcome{background:var(--vault);color:#E7F0EA;position:relative;overflow:hidden;padding:30px}
.welcome .rosette{position:absolute;right:-140px;top:-140px;width:380px;height:380px;opacity:.35;pointer-events:none}
.welcome h2{font-size:30px;position:relative}

.welcome .field>span{color:#B3C7BB}

.toast button{background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;height:32px;padding:0 14px;font-weight:600;font-size:13px}
.toast.plain{padding:12px 18px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

.view{animation:viewin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note svg{width:16px;height:16px;flex:none;margin-top:2px}
.callout{padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:13.5px}

.tabbar::-webkit-scrollbar{display:none}
.tabbar button{border:0;background:none;padding:10px 14px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}

.welcome .acts .btn.primary{color:var(--gold-ink)}

@media (max-width:1100px){

  .modal{padding:22px}

@media (max-width:420px){

}
@media print{
  .side,.tabs,.top .year,.top .icon-btn{display:none}
  .shell{display:block}
}

/* ============ calculations (pure-ish, read S) ============ */
function ym(y, m) { while (m < 0) { m += 12; y--; } while (m > 11) { m -= 12; y++; } return [y, m]; }
function budMonth(y, m) {
  [y, m] = ym(y, m);
  const d = S.budget.data[mkey(y, m)] || {}, o = {};
  for (const g of BUD_GROUPS) {
    let p = null, a = null;
    for (const r of S.budget.rows[g.k]) { const c = d[r.id]; if (c) { if (isNum(c.p)) p = (p || 0) + c.p; if (isNum(c.a)) a = (a || 0) + c.a; } }
    o[g.k] = { p, a };
  }
  o.outP = sumN(o.living.p, o.debt.p, o.future.p); o.outA = sumN(o.living.a, o.debt.a, o.future.a);
  o.inP = o.income.p; o.inA = o.income.a;
  o.netP = o.inP == null && o.outP == null ? null : (o.inP || 0) - (o.outP || 0);
  o.netA = o.inA == null && o.outA == null ? null : (o.inA || 0) - (o.outA || 0);
  o.hasA = o.inA != null || o.outA != null; o.hasP = o.inP != null || o.outP != null;
  return o;
}
const budYear = (y) => MON.map((_, m) => budMonth(y, m));
function latestBud(y) { const ys = budYear(y); for (let m = 11; m >= 0; m--) if (isNum(ys[m].inA) && ys[m].inA > 0) return { m, d: ys[m] }; return null; }
function avgSpend(y, onlyLiving) {
  const ys = budYear(y).filter((d) => isNum(d.living.a) || isNum(d.debt.a));
  if (!ys.length) return null;
  return ys.reduce((s, d) => s + (d.living.a || 0) + (onlyLiving ? 0 : (d.debt.a || 0)), 0) / ys.length;
}
function worthMonth(y, m) {
  [y, m] = ym(y, m);
  const d = S.worth.data[mkey(y, m)] || {}, o = {};
  for (const g of W_GROUPS) { let s = null; for (const r of S.worth.rows[g.k]) { const v = d[r.id]; if (isNum(v)) s = (s || 0) + v; } o[g.k] = s; }
  o.assets = sumN(o.cash, o.invest, o.fixed, o.other);
  o.nw = o.assets == null && o.liab == null ? null : (o.assets || 0) - (o.liab || 0);
  return o;
}
function latestWorth(y) { for (let m = 11; m >= 0; m--) { const w = worthMonth(y, m); if (w.nw != null) return { m, w }; } return null; }
function worthRowLatest(re, group = 'cash') {
  const r = S.worth.rows[group].find((x) => re.test(x.name)); if (!r) return null;
  for (let y = S.year; y >= S.year - 1; y--) for (let m = 11; m >= 0; m--) { const v = (S.worth.data[mkey(y, m)] || {})[r.id]; if (isNum(v)) return { v, y, m }; }
  return null;
}
function budRowPlanLatest(re, group = 'future') {
  const r = S.budget.rows[group].find((x) => re.test(x.name)); if (!r) return null;
  for (let m = 11; m >= 0; m--) { const c = (S.budget.data[mkey(S.year, m)] || {})[r.id]; if (c && isNum(c.p)) return { v: c.p, m }; }
  return null;
}

function emCalc() {
  const e = S.emergency;
  const target = isNum(e.monthly) && isNum(e.months) ? e.monthly * e.months : null;
  const gap = target != null ? Math.max(target - (e.current || 0), 0) : null;
  const months = gap != null && gap > 0 && isNum(e.saving) && e.saving > 0 ? gap / e.saving : gap === 0 ? 0 : null;
  const cover = isNum(e.monthly) && e.monthly > 0 && isNum(e.current) ? e.current / e.monthly : null;
  return { target, gap, months, cover, frac: target ? (e.current || 0) / target : 0 };
}

function pmt(rate, n, pv) { return rate === 0 ? pv / n : pv * rate / (1 - Math.pow(1 + rate, -n)); }
function kprCalc() {
  const k = S.kpr;
  if (!isNum(k.price) || !isNum(k.years) || k.years <= 0 || !isNum(k.rateFix)) return null;
  const P = k.price * (1 - (k.dp || 0)), N = Math.round(k.years * 12);
  const Nf = clamp(Math.round((isNum(k.fixYears) ? k.fixYears : k.years) * 12), 0, N), Nfl = N - Nf;
  const rf = k.rateFix / 12, rfl = (k.rateFloat || 0) / 12;
  let start = null; if (/^\d{4}-\d{2}$/.test(k.start || '')) { const [a, b] = k.start.split('-').map(Number); start = [a, b - 1]; }
  const sched = []; let bal = P;
  const payF = Nf > 0 ? pmt(rf, N, P) : 0;
  for (let i = 1; i <= Nf; i++) { const int = bal * rf, pr = payF - int, open = bal; bal -= pr; sched.push({ i, open, pr, int, pay: payF, bal }); }
  const balAtFloat = bal; let payFl = 0;
  if (Nfl > 0) { payFl = pmt(rfl, Nfl, balAtFloat); for (let j = 1; j <= Nfl; j++) { const int = bal * rfl, pr = payFl - int, open = bal; bal -= pr; sched.push({ i: Nf + j, open, pr, int, pay: payFl, bal, fl: true }); } }
  sched.forEach((r) => { if (start) { const [yy, mm] = ym(start[0], start[1] + r.i - 1); r.y = yy; r.m = mm; } else { r.y = Math.ceil(r.i / 12); r.m = (r.i - 1) % 12; } });
  const pays = sched.map((r) => r.pay), minPay = Math.min(...pays), maxPay = Math.max(...pays);
  const interest = sched.reduce((a, r) => a + r.int, 0);
  const net = isNum(k.income) ? k.income - (k.other || 0) : null;
  const rMin = net > 0 ? minPay / net : null, rMax = net > 0 ? maxPay / net : null;
  const dp = k.price * (k.dp || 0);
  const c = {};
  c.bphtb = Math.max(k.price - (k.npoptkp || 0), 0) * (k.bphtb || 0);
  c.ppn = k.newHome ? k.price * 0.11 * (1 - (k.ppnDisc || 0)) : 0;
  c.ajb = k.price * (k.ajb || 0);
  c.bbn = k.price * (k.bbn || 0);
  c.notary = k.notary || 0;
  c.booking = k.booking || 0;
  c.provisi = P * (k.provisi || 0);
  c.appraisal = k.appraisal || 0;
  c.bankOther = k.bankOther || 0;
  const other = Object.values(c).reduce((a, b) => a + b, 0);
  let end = null; if (start) { const [yy, mm] = ym(start[0], start[1] + N); end = MONTHS[mm] + ' ' + yy; }
  return { P, N, Nf, Nfl, payF, payFl, balAtFloat, sched, minPay, maxPay, interest, rMin, rMax, dp, c, other, total: dp + P + interest + other, end, start };
}
function kprVerdict(a, b) {
  if (!isNum(a)) return null;
  if (a < .3) return b < .3 ? ['ok', 'Sehat', 'Cicilan terendah dan tertinggi sama-sama di bawah 30% penghasilan. Masih ada ruang lega untuk biaya hidup, dana darurat, dan investasi.']
    : ['mid', 'Sehat di awal, waspada saat bunga floating', 'Selama bunga fix cicilan masih ringan, tapi setelah masuk floating porsinya naik. Siapkan cadangan dari sekarang supaya kenaikan cicilan tidak mengganggu arus kas.'];
  if (a <= .4) return b <= .4 ? ['mid', 'Masih aman, perlu disiplin', 'Cicilan memakan 30 sampai 40% penghasilan. Tetap bisa jalan asal arus kas dijaga ketat dan dana darurat diprioritaskan.']
    : ['bad', 'Aman di awal, berat saat floating', 'Masa bunga fix masih tertangani, tapi saat floating cicilan lewat 40% penghasilan. Pertimbangkan DP lebih besar, tenor lebih panjang, atau menambah penghasilan sebelum masa floating.'];
  if (a <= .5) return ['bad', 'Mulai membebani', 'Cicilan memakan 40 sampai 50% penghasilan, jadi sulit menabung dan berinvestasi. Coba naikkan DP, perpanjang tenor, atau pilih properti yang lebih murah.'];
  return ['bad', 'Tidak sehat', 'Cicilan melewati separuh penghasilan. Risiko gagal bayar dan terjerat utang lain tinggi. Sebaiknya hitung ulang harga properti, DP, atau tenornya.'];
}

function goalCalc(g) {
  const gap = isNum(g.target) ? Math.max(g.target - (g.current || 0), 0) : null;
  const plain = gap != null && gap > 0 && g.saving > 0 ? gap / g.saving : gap === 0 ? 0 : null;
  let inv = null; const series = [], flat = [];
  if (isNum(g.target) && (g.saving > 0 || (g.rate > 0 && g.current > 0))) {
    let b = g.current || 0, f = g.current || 0, n = 0; series.push(b); flat.push(f);
    if (b >= g.target) inv = 0;
    else while (n < 1200) { n++; b = b + b * (g.rate || 0) / 12 + (g.saving || 0); f += g.saving || 0; series.push(b); flat.push(f); if (b >= g.target) { inv = n; break; } }
  }
  return { gap, plain, inv, series, flat };
}

const INV_CATS = [
  { k: 'rd', name: 'Reksa dana', color: 'var(--c-future)' },
  { k: 'idx', name: 'Saham Indonesia', color: 'var(--c-living)' },
  { k: 'us', name: 'Saham US', color: 'var(--c-plum)' },
  { k: 'crypto', name: 'Kripto', color: 'var(--c-gold)' },
  { k: 'other', name: 'Lainnya', color: 'var(--c-debt)' },
];
function invRow(cat, r) {
  const fx = S.invest.usdidr;
  const o = { mv: null, cost: null, pl: null, pct: null, mvUsd: null, plUsd: null };
  if (cat === 'rd' || cat === 'other') { o.mv = isNum(r.now) ? r.now : null; o.cost = isNum(r.buy) ? r.buy : null; }
  else if (cat === 'idx') { if (isNum(r.lots) && isNum(r.price)) o.mv = r.lots * 100 * r.price; if (isNum(r.lots) && isNum(r.avg)) o.cost = r.lots * 100 * r.avg; }
  else if (cat === 'us') {
    if (isNum(r.qty) && isNum(r.price)) o.mvUsd = r.qty * r.price;
    if (isNum(r.qty) && isNum(r.avg)) o.costUsd = r.qty * r.avg;
    if (o.mvUsd != null && o.costUsd != null) o.plUsd = o.mvUsd - o.costUsd;
    if (isNum(fx)) { if (o.mvUsd != null) o.mv = o.mvUsd * fx; if (o.costUsd != null) o.cost = o.costUsd * fx; }
  } else if (cat === 'crypto') {
    if (isNum(r.qty) && isNum(r.price)) o.mvUsd = r.qty * r.price;
    if (isNum(fx) && o.mvUsd != null) o.mv = o.mvUsd * fx;
    o.cost = isNum(r.cost) ? r.cost : null;
  }
  if (o.mv != null && o.cost != null) { o.pl = o.mv - o.cost; o.pct = o.cost ? o.pl / o.cost : null; }
  return o;
}
function invTotals() {
  const out = { mv: 0, cost: 0, pl: 0, plBase: 0, cats: {}, missingFx: false, any: false };
  for (const c of INV_CATS) {
    let mv = 0, cost = 0, pl = 0, base = 0, n = 0;
    for (const r of S.invest[c.k]) {
      const o = invRow(c.k, r); n++;
      if ((c.k === 'us' || c.k === 'crypto') && o.mvUsd != null && o.mv == null) out.missingFx = true;
      if (o.mv != null) mv += o.mv;
      if (o.pl != null) { pl += o.pl; base += o.cost; }
      if (o.cost != null) cost += o.cost;
    }
    out.cats[c.k] = { mv, cost, pl, base, n };
    out.mv += mv; out.cost += cost; out.pl += pl; out.plBase += base;
    if (n) out.any = true;
  }
  return out;
}

function retireCalc() {
  const r = S.retire;
  const years = isNum(r.age) && isNum(r.retireAge) ? r.retireAge - r.age : null;
  if (years == null || years < 0) return { years };
  const n = years * 12, i = (r.ret || 0) / 12, wr = r.wr || 0.04;
  const mAt = isNum(r.monthly) ? r.monthly * Math.pow(1 + (r.inflation || 0), years) : null;
  const need = mAt != null ? mAt * 12 / wr : null;
  let b = r.current || 0; const path = [b];
  for (let k = 1; k <= n; k++) { b = b + b * i + (r.saving || 0); if (k % 12 === 0) path.push(b); }
  const fv = b, diff = need != null ? fv - need : null;
  let req = null;
  if (need != null && n > 0) {
    const g = Math.pow(1 + i, n), pvF = (r.current || 0) * g, rem = need - pvF;
    req = rem <= 0 ? 0 : i === 0 ? rem / n : rem * i / (g - 1);
  }
  return { years, n, mAt, yAt: mAt != null ? mAt * 12 : null, need, fv, diff, req, path };
}

function pyrStats() {
  const lv = S.pyramid.map((l, i) => { const t = l.items.length, d = l.items.filter((x) => x.done).length; return { i, t, d, f: t ? d / t : 0 }; });
  const all = lv.reduce((a, b) => a + b.t, 0), done = lv.reduce((a, b) => a + b.d, 0);
  let cur = lv.findIndex((l) => l.f < 1); if (cur < 0) cur = lv.length - 1;
  return { lv, all, done, cur, f: all ? done / all : 0 };
}

};

      <div class="goal-body">
        <div class="form">
          ${field('Dana yang dibutuhkan', money(`goals.${g.id}.target`), '', 'full')}
          ${field('Sudah terkumpul', money(`goals.${g.id}.current`))}
          ${field('Nabung per bulan', money(`goals.${g.id}.saving`))}

  calc() {

V.rebalancing = {
  title: 'Rebalancing', icon: 'scale', group: 3,
  html() {
    const md = S.ui.rebMode, rs = S.rebal.rows;
    const head = md === 1 ? ['Aset', 'Nilai sekarang', 'Porsi sekarang', 'Porsi target', 'Nilai ideal', 'Tambah / kurangi'] : ['Aset', 'Nilai sekarang', 'Porsi sekarang', 'Tambah / kurangi', 'Nilai baru', 'Porsi baru'];
    return `<p class="lede">Seiring waktu, porsi aset bergeser karena ada yang naik lebih cepat. Rebalancing mengembalikannya ke komposisi yang kamu inginkan, sesuai tujuan dan profil risikomu.</p>
    <div class="row" style="margin-bottom:16px"><div class="seg" role="group"><button data-mode="1" aria-pressed="${md === 1}">Dari porsi target</button><button data-mode="2" aria-pressed="${md === 2}">Dari nominal</button></div><span class="spacer"></span><button class="btn sm" data-frominv>${ic('sync')}Ambil dari Monitor Investasi</button></div>
    <p class="small muted" style="margin:-4px 0 14px">${md === 1 ? 'Isi porsi target tiap aset (totalnya 100%). Kolom terakhir menunjukkan berapa yang perlu ditambah atau dijual.' : 'Isi rencana penambahan atau penjualan tiap aset (pakai tanda minus untuk menjual). Porsi baru langsung terhitung.'}</p>
    ${rs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rs.map((r) => `<tr><td class="ed l">${textIn(`rebal.rows.${r.id}.name`, { ph: 'Nama aset' })}</td><td class="ed">${money(`rebal.rows.${r.id}.value`, { bare: true, ph: '' })}</td><td data-k="now-${r.id}"></td>${md === 1 ? `<td class="ed" style="width:120px">${pctIn(`rebal.rows.${r.id}.target`, { ph: '' })}</td><td data-k="ideal-${r.id}"></td><td data-k="diff-${r.id}"></td>` : `<td class="ed">${money(`rebal.rows.${r.id}.adj`, { bare: true, ph: '', neg: true })}</td><td data-k="new-${r.id}"></td><td data-k="newp-${r.id}"></td>`}<td style="width:40px;padding:4px"><button class="x btn ghost sm" data-delr="${r.id}" aria-label="Hapus">${ic('x')}</button></td></tr>`).join('')}</tbody><tfoot><tr data-k="foot"></tr></tfoot></table></div>` : emptyBox('Belum ada aset', 'Tambahkan kelas aset satu per satu, atau ambil langsung dari Monitor Investasi.', `<button class="btn primary" data-addr>${ic('plus')}Tambah aset</button>`)}
    ${rs.length ? `<div class="row mt"><button class="btn" data-addr>${ic('plus')}Tambah aset</button></div><section class="panel mt"><h2>Sebelum dan sesudah</h2><p class="sub">Porsi tiap aset sekarang dibandingkan dengan ${md === 1 ? 'target' : 'setelah penyesuaian'}.</p><div data-k="viz"></div></section>` : ''}`;
  },
  calc() {
    const md = S.ui.rebMode, rs = S.rebal.rows, o = {};
    const tot = rs.reduce((a, r) => a + (r.value || 0), 0), tt = rs.reduce((a, r) => a + (r.target || 0), 0);
    const totAdj = rs.reduce((a, r) => a + (r.adj || 0), 0), totNew = tot + totAdj;
    let viz = '';
    rs.forEach((r, i) => {
      const now = tot ? (r.value || 0) / tot : null; o['now-' + r.id] = pctf(now);
      let after;
      if (md === 1) { const ideal = isNum(r.target) ? r.target * tot : null, df = ideal != null ? ideal - (r.value || 0) : null; o['ideal-' + r.id] = rp(ideal); o['diff-' + r.id] = isNum(df) ? `<span class="${tone(df)}">${Math.round(df) === 0 ? 'Sudah pas' : (df > 0 ? 'Tambah ' : 'Kurangi ') + rp(Math.abs(df))}</span>` : '–'; after = r.target; }
      else { const nv = (r.value || 0) + (r.adj || 0); o['new-' + r.id] = rp(nv); after = totNew ? nv / totNew : null; o['newp-' + r.id] = pctf(after); }
      const col = ['var(--c-future)', 'var(--c-living)', 'var(--c-plum)', 'var(--c-gold)', 'var(--c-debt)', 'var(--c-income)', 'var(--c-slate)'][i % 7];
      viz += `<div style="display:grid;grid-template-columns:minmax(90px,160px) 1fr;gap:6px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div class="small" style="font-weight:600">${esc(r.name || 'Tanpa nama')}</div><div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1;height:10px"><i style="width:${(now || 0) * 100}%;background:var(--line-2)"></i></div><span class="small muted tnum" style="width:48px;text-align:right">${pctf(now, 0)}</span></div><div class="row" style="gap:8px;flex-wrap:nowrap;margin-top:4px"><div class="bar" style="flex:1;height:10px"><i style="width:${clamp(after || 0, 0, 1) * 100}%;background:${col}"></i></div><span class="small tnum" style="width:48px;text-align:right;font-weight:600">${pctf(after, 0)}</span></div></div></div>`;
    });
    o.viz = viz + legend([['var(--line-2)', 'Sekarang'], ['var(--c-future)', md === 1 ? 'Target' : 'Sesudah']]);
    if (md === 1) {
      const ok = Math.abs(tt - 1) < 0.0005;
      o.foot = `<td>Total</td><td>${rp(tot)}</td><td>${tot ? '100%' : '–'}</td><td><span class="badge ${ok ? 'ok' : 'bad'}">${pctf(tt, 1)}${ok ? '' : ' (harus 100%)'}</span></td><td>${rp(tt * tot)}</td><td></td><td></td>`;
    } else {
      o.foot = `<td>Total</td><td>${rp(tot)}</td><td>${tot ? '100%' : '–'}</td><td><span class="badge ${Math.round(totAdj) === 0 ? 'ok' : 'mid'}">${Math.round(totAdj) === 0 ? 'Hanya memindahkan' : (totAdj > 0 ? 'Uang baru ' : 'Ditarik ') + rp(Math.abs(totAdj))}</span></td><td>${rp(totNew)}</td><td>${totNew ? '100%' : '–'}</td><td></td>`;
    }
    return o;
  },
  bind(root) {
    root.addEventListener('click', (e) => {
      const m = e.target.closest('[data-mode]'); if (m) { S.ui.rebMode = +m.dataset.mode; save(); rerender(); return; }
      if (e.target.closest('[data-addr]')) { const r = { id: uid(), name: '', value: null, target: null, adj: null }; S.rebal.rows.push(r); save(); rerender(); setTimeout(() => $(`[data-b="rebal.rows.${r.id}.name"]`, document)?.focus(), 30); return; }
      const d = e.target.closest('[data-delr]'); if (d) { removeWithUndo(() => { S.rebal.rows = S.rebal.rows.filter((r) => r.id !== d.dataset.delr); }, 'Aset dihapus'); return; }
      if (e.target.closest('[data-frominv]')) {
        const t = invTotals(); if (!t.any) { toast('Monitor Investasi masih kosong'); return; }
        const snap = clone(S);
        for (const c of INV_CATS) {
          const v = t.cats[c.k].mv; if (!v) continue;
          let r = S.rebal.rows.find((x) => x.name.toLowerCase() === c.name.toLowerCase());
          if (!r) { r = { id: uid(), name: c.name, value: null, target: null, adj: null }; S.rebal.rows.push(r); }
          r.value = Math.round(v);
        }
        save(); rerender(); toast('Nilai aset diambil dari Monitor Investasi', () => { S = snap; save(); rerender(); });
      }
    });
  },
};

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { applyTheme(); refresh(); });
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-demo]')) {
    const hasOwn = !S.demo && (Object.keys(S.budget.data).length || Object.keys(S.worth.data).length || S.goals.length || invTotals().any);
    if (hasOwn) confirmBox('Ganti dengan data contoh?', 'Catatanmu yang sekarang akan diganti angka rekaan. Unduh backup dulu kalau masih butuh.', 'Muat data contoh', loadDemo, true); else loadDemo();
  }
  if (e.target.closest('[data-cleardemo]')) { const th = S.theme, nm = S.name; S = fresh(); S.seen = true; S.theme = th; S.name = nm; save(true); rerender(); toast('Data contoh dihapus. Selamat mencatat!'); }
});

function welcome() {
  const m = modal(`${rosette()}<div style="position:relative"><div style="width:52px;height:52px;margin-bottom:18px">${LOGO}</div><h2>Halo! Ini ur.financialguy.</h2><p>Catat arus kas, pantau kekayaan bersih, lalu hitung rencana besar seperti dana darurat, KPR, sampai pensiun. Semua data tersimpan di perangkat ini, tanpa akun.</p>
    <label class="field"><span>Mau dipanggil siapa?</span><div class="inp"><input id="wname" placeholder="Nama panggilan" autocomplete="given-name"></div></label>
    <div class="acts"><button class="btn" data-w="demo">Coba pakai data contoh</button><button class="btn primary" data-w="start">Mulai dari nol</button></div></div>`, 'welcome');
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-w]'); if (!b) return;
    S.name = $('#wname', m.el).value.trim(); S.seen = true;
    if (b.dataset.w === 'demo') { m.close(); loadDemo(); } else { save(true); m.close(); location.hash = '#/arus-kas'; rerender(); }
  });
  $('#wname', m.el).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('[data-w="start"]', m.el).click(); });
}

/* ============ init ============ */
shell();
addEventListener('hashchange', route);
route();
const qp = new URLSearchParams(location.search);
if (qp.has('demo')) {
  history.replaceState(null, '', location.pathname + location.hash);
  const hasOwn = S.seen && !S.demo && (Object.keys(S.budget.data).length || Object.keys(S.worth.data).length);
  if (!hasOwn) { S.seen = true; loadDemo(); } else if (!S.demo) confirmBox('Ganti dengan data contoh?', 'Kamu sudah punya catatan sendiri di perangkat ini. Data contoh akan menggantikannya.', 'Muat data contoh', loadDemo, true);
} else if (!S.seen) welcome();
if (!canStore) toast('Browser ini tidak mengizinkan penyimpanan. Unduh backup sebelum menutup.');
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => { }));

})();
</script>
